server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  profiles:
    active: local
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${azure.datasource.driver-class-name}
      url: jdbc:mysql://${azure.datasource.host}:${azure.datasource.port}/${azure.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${azure.datasource.username}
      password: ${azure.datasource.password}
  data:
    redis:
      host: ${azure.redis.host}
      port: ${azure.redis.port}
      database: ${azure.redis.database}
    # password:无密码

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.azure.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      azure:
        mapper: debug
        service: info
        controller: info

azure:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: ${azure.jwt.admin-secret-key}
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token

    # 设置jwt签名加密时使用的秘钥
    user-secret-key: ${azure.jwt.user-secret-key}
    # 设置jwt过期时间
    user-ttl: 7200000
    # 设置前端传递过来的令牌名称
    user-token-name: authentication

# Knife4j 4.5 的增强插件与 Springdoc 2.8 的方法签名不兼容，暂时关闭增强功能。
# /doc.html 页面及 OpenAPI 分组仍由 Starter 和 Springdoc 提供。
knife4j:
  enable: false

# Test-only configuration: never read application-local.yml or contact local services.
spring:
  datasource:
    druid:
      driver-class-name: org.h2.Driver
      url: jdbc:h2:mem:sky_boot;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,VALUE
      username: sa
      password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql
sky:
  jwt:
    # 公开测试数据，与 WebTestConfiguration 一致，不读取本地私有密钥。
    admin-secret-key: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="
    user-secret-key: "ICEiIyQlJicoKSorLC0uLzAxMjM0NTY3ODk6Ozw9Pj8="
  datasource:
    driver-class-name: org.h2.Driver
    host: unused.invalid
    port: 1
    database: test
    username: sa
    password: ""
  redis:
    host: unused.invalid
    port: 1
    database: 0
  upload-path: ${java.io.tmpdir}/sky-context-test-upload
  wechat:
    appid: test-app
    secret: test-secret

logging:
  level:
    com.sky: WARN
